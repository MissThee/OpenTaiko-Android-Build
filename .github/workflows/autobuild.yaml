# Original script from totoa553/OpenTaiko and DragonRatTiger/OpenTaiko

name: Build OpenTaiko (Android + iOS)

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # 1) prepare - derive the release version, bump/commit it, create the release.
  #    Runs first. Both platform builds depend on its versionLast output.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: windows-latest

    outputs:
      versionLast: ${{ steps.extract-versions.outputs.versionLast }}

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    env:
      messagePathPrefix: COMMIT_MSG_
      versionsPath: COMMIT_VERSIONS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Observe the Directory
        shell: cmd
        run: |
          dir

      - name: Get each commit message for version checking
        id: get-latest-commits
        run: |
          $messages = ConvertFrom-Json $env:messagesJson
          $nMessages = $messages.Count
          echo "nMessages=$nMessages" >> $env:GITHUB_ENV
          for ($c = 0; $c -lt $nMessages; ++$c) {
              New-Item -Path ($env:messagePathPrefix + $c) -Type file
              $message = $messages | Select-Object -Index $c
              echo $message > ($env:messagePathPrefix + $c)
          }
        env:
          messagesJson: ${{ toJSON(github.event.commits.*.message) }}

      - name: Get project version
        uses: kzrnm/get-net-sdk-project-versions-action@v2
        id: get-version
        with:
          proj-path: OpenTaiko/OpenTaiko.csproj

      - name: Store projectVersion in environment
        run: |
          echo "projectVersion=${{ steps.get-version.outputs.version }}" >> $env:GITHUB_ENV

      - name: Extract latest version info from each commit message
        id: extract-versions
        run: |
          $hasVersion = $false
          $version = $env:projectVersion
          New-Item -Path $env:versionsPath -Type file
          for ($c = 0; $c -lt $env:nMessages; ++$c) {
              $commitSubject = Get-Content -Path ($env:messagePathPrefix + $c) | Select-Object -First 1
              if ($commitSubject -match '^(?<version>[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\s-\s') {
                  $hasVersion = $true
                  $version = $matches['version']
              }
              if ($c -eq 0) {
                  echo "versionFirst=$version" >> $env:GITHUB_ENV
              }
              echo $version >> $env:versionsPath
          }

          # check the latest version
          if ($hasVersion) {
              Write-Host "Extracted latest version is: $version"
              echo "version=$version" >> $env:GITHUB_ENV
          } else {
              Write-Host "No valid version found in the latest commit messages. Skipping bump."
              echo "version=" >> $env:GITHUB_ENV
          }
          echo "versionLast=$version" >> $env:GITHUB_ENV
          echo "versionLast=$version" >> $env:GITHUB_OUTPUT

      - name: Bump OpenTaiko version if necessary
        if: env.version != ''
        run: |
          $newVersion = $env:version
          Write-Host "Updating version in OpenTaiko.csproj to $newVersion"
          (Get-Content OpenTaiko/OpenTaiko.csproj) -replace '<Version>.*<\/Version>', "<Version>$newVersion</Version>" | Set-Content OpenTaiko/OpenTaiko.csproj

      - name: Get current date
        id: get-date
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          echo "date=$date" >> $env:GITHUB_ENV

      - name: Update CHANGELOG.md
        run: |
          $versions = Get-Content -Path $env:versionsPath
          $date = $env:date
          $changelogPath = "CHANGELOG.md"

          :commit for ($c = 0; $c -lt $env:nMessages; ++$c) {
              # (Re-)read CHANGELOG.md content as (Re-)split lines
              $changelog = @(Get-Content -Path $changelogPath)

              # Read the message as individual items
              $commitBody = Get-Content -Path ($env:messagePathPrefix + $c) | Select-Object -Skip 1

              # Remove empty lines from the message
              $message = ($commitBody | Where-Object { $_ -ne "" }) -join "`n"

              # Check if the version already exists
              $version = $versions | Select-Object -Index $c
              for ($i = 0; $i -lt $changelog.Count; ++$i) {
                  if (-not ($changelog[$i] -match "## \[$version\]")) {
                      continue
                  }
                  # Capture the existing content under the version heading
                  if ($message) {
                      # Append after the empty line (if exist) or the heading
                      $di = ($changelog[$i + 1] -eq "")
                      $changelog[$i + $di] += "`n$message"
                  }

                  # Write updated content back to CHANGELOG.md
                  Set-Content -Path $changelogPath -Value $changelog

                  continue commit
              }

              # Insert new version under '# Changelog'
              for ($i = 0; $i -lt $changelog.Count; ++$i) {
                  if (-not ($changelog[$i] -match "# Changelog")) {
                      continue
                  }
                  # Append after the title, create empty line space
                  $changelog[$i] += "`n`n## [$version] - $date (Beta)`n`n"
                  if ($message) {
                      $changelog[$i] += "$message`n"
                  }
                  # Remove original empty line space
                  while (++$i -lt $changelog.Count) {
                      if ($changelog[$i] -ne "") {
                          break
                      }
                      $changelog[$i] = $null
                  }

                  # Write updated content back to CHANGELOG.md
                  Set-Content -Path $changelogPath -Value $changelog

                  continue commit
              }

              # No '# Changelog', do nothing
              break commit
          }

      - name: Commit CHANGELOG.md and OpenTaiko.csproj changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add OpenTaiko/OpenTaiko.csproj
          git add CHANGELOG.md
          if ($env:versionLast -eq $env:versionFirst) {
              git commit -m "Update changelog for version $env:versionLast"
          } else {
              git commit -m "Update changelog for versions $env:versionFirst to $env:versionLast"
          }
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}

      - name: Check if tag exists
        uses: mukunku/tag-exists-action@v1.6.0
        id: check-tag
        with:
          tag: ${{ env.version }}

      - name: Create Release
        if: steps.check-tag.outputs.exists == 'false' && env.version != ''
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.version }}
          release_name: OpenTaiko v${{ env.version }}
          body: |
            Note: The releases do not contain skins nor songs.
            Please download/update through the OpenTaiko Hub: https://github.com/OpenTaiko/OpenTaiko-Hub/releases
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # 2) iOS IPA - builds BEFORE Android on macOS.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build OpenTaiko (iOS IPA)
    needs: prepare
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      versionLast: ${{ needs.prepare.outputs.versionLast }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # LOCK THE ENTIRE TOOLCHAIN AS ONE MATCHED SET.
      # .NET SDK, iOS workload, Xcode and the simulator runtime must all agree:
      #   SDK 10.0.100 + workload set 10.0.100 -> .NET for iOS 26.0.11017 -> Xcode 26.0
      # If dotnet-version floats (10.0.x) or the workload is installed unpinned, the
      # SDK rolls forward to 10.0.4xx and pulls .NET for iOS 27.2.10000, which requires
      # Xcode 27.2 and would fail with "This version of .NET for iOS (27.2.10000)
      # requires Xcode 27.2. The current version of Xcode is 26.0.1".
      # We stay on Xcode 26.0 deliberately: this project targets iOS 14, and Xcode 27
      # enforces a minimum deployment target of iOS 15 (build-ios.sh asserts iOS 14).
      - name: Setup .NET 10.0.100 (band matching the Xcode 26.0 workload set)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      # Pin the SDK feature band for every dotnet command in this job (hosted images
      # carry several SDKs; without this, dotnet build picks the newest one). Job-local
      # on purpose: it must not affect the Windows/Android build job.
      - name: Pin .NET SDK + workload set for this job
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestPatch",
              "workloadVersion": "10.0.100"
            }
          }
          EOF
          echo "global.json:" && cat global.json
          echo "active SDK:" && dotnet --version

      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # global.json pins workloadVersion=10.0.100, so do NOT pass --version here:
      # dotnet errors with "Cannot specify a particular workload version on the
      # command line ... when there is already a version specified in global.json".
      - name: Install iOS workload (version pinned by global.json)
        run: |
          dotnet workload install ios
          dotnet workload --info

      # Apple's toolchain (actool, used to compile the AppIcon asset catalog) needs a
      # simulator runtime matching the selected Xcode SDK even for a device-only
      # (ios-arm64) build. macos-latest ships newer runtimes (26.1/26.2/26.3) but not
      # the iOS 26.0 runtime that Xcode 26.0 (iphonesimulator SDK 23A339) expects, so
      # actool fails with:
      #   "No simulator runtime version from [...] available to use with iphonesimulator SDK version 23A339"
      # For Xcode 26.x the iOS runtime version equals the Xcode version -> pin 26.0
      # (pinning matters: an unpinned download would grab a newer, incompatible runtime).
      - name: Install matching iOS simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 26.0 -architectureVariant universal
          xcrun simctl list runtimes

      - name: Verify Xcode toolchain and pinned workload
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet --version
          dotnet workload --info

      - name: Build iOS IPA (iOS 14+)
        run: bash build-ios.sh

      - name: Upload iOS IPA for the Latest Release
        uses: xresloader/upload-to-github-release@v1.6.0
        with:
          file: "OpenTaiko.iOS.ipa"
          overwrite: true
          tag_name: ${{ env.versionLast }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload iOS dSYM archive for the Latest Release
        if: hashFiles('OpenTaiko.iOS.dSYM.zip') != ''
        uses: xresloader/upload-to-github-release@v1.6.0
        with:
          file: "OpenTaiko.iOS.dSYM.zip"
          overwrite: true
          tag_name: ${{ env.versionLast }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3) Android APK - runs AFTER iOS succeeds (needs: build-ios).
  # ---------------------------------------------------------------------------
  build-android:
    name: Build OpenTaiko (Android APK)
    needs: [prepare, build-ios]
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      versionLast: ${{ needs.prepare.outputs.versionLast }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # prepare already bumped + pushed the version, but a fresh checkout in this
      # job gets the original triggering commit. Re-apply the final version locally
      # (no push) so the APK carries the same version as the release tag.
      - name: Apply release version to project (local, no push)
        run: |
          $v = '${{ needs.prepare.outputs.versionLast }}'
          if ($v) {
            Write-Host "Setting version to $v for the Android build"
            (Get-Content OpenTaiko/OpenTaiko.csproj) -replace '<Version>.*<\/Version>', "<Version>$v</Version>" | Set-Content OpenTaiko/OpenTaiko.csproj
          }

      - name: Build Android APK
        shell: cmd
        run: |
          build-android.bat

      - name: Upload Android APK for the Latest Release
        uses: xresloader/upload-to-github-release@v1.6.0
        with:
          file: "OpenTaiko.Android.apk"
          overwrite: true
          tag_name: ${{ env.versionLast }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
